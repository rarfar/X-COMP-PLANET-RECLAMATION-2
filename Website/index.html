<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-COMP: Planet Reclamation 2025</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Snowfall script from cdnjs -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Snowstorm/20131208/snowstorm-min.js"
      integrity="sha512-rMkLONrw50boYG/6Ku0E8VstfWMRn5D0dX3QZS26Mg0rspYq4EHxYOULuPbv9Be2HBbrrmN8dpPgYUeJ4bINCA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- Title and Paragraph outside the black container -->
    <div class="header">
      <h1 class="title">X-COMP: Planet Reclamation 2025</h1>
      <p class="subtitle">
        Welcome to the official download page for X-COMP: Planet Reclamation 2025.
        Click the button below to download your copy of the game and join the mission to save the planet!
      </p>
    </div>

    <!-- Black container with file download section -->
    <div class="container">
      <div class="file-container">
        <img src="game_icon.png" alt="X-COMP Game Icon" class="file-icon" />
        <a href="game-file.zip" class="download-link" download>Download Here</a>
      </div>
    </div>

    <!-- Feedback Container -->
    <div class="container feedback-container">
      <p class="feedback-text">
        If you have any feedback for the development team, click
        <a href="https://forms.gle/your-google-form-link" target="_blank" class="feedback-link">here</a>!
      </p>
    </div>
  </body>
</html>
